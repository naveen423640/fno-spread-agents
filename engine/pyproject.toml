[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnoengine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.6",
  "pyarrow==25.0.1",
  "fastapi==0.129.1",
  "uvicorn==0.41.0",
  "tzdata==2025.3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
